name: SaaS tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r saas-invoicing/backend/requirements.txt
      - run: python -m pytest saas-invoicing/backend/test_main.py -v
