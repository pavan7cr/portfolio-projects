name: Pipeline daily (scheduled batch)
on:
  schedule: [{cron: "0 8 * * *"}]
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python data-pipeline-platform/pipeline_full.py --synthetic --rows 50000 --no-live
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-dashboard
          path: |
            data-pipeline-platform/dashboard_large.json
            data-pipeline-platform/dashboard.html
